<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriageBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <main class="mx-auto max-w-6xl px-4 py-8 sm:px-6">
    <header class="mb-8">
      <h1 class="text-2xl font-semibold tracking-tight sm:text-3xl">TriageBot</h1>
      <p class="mt-1 text-sm text-slate-600">Tablero de incidencias con clasificación automática por IA.</p>
    </header>

    <section class="rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6" aria-labelledby="new-ticket-heading">
      <h2 id="new-ticket-heading" class="text-base font-semibold">Nuevo ticket</h2>
      <form
        hx-post="/ui/tickets"
        hx-target="#tickets-section"
        hx-swap="outerHTML"
        hx-disabled-elt="#create-ticket-btn"
        class="mt-4 space-y-4 max-w-xl"
      >
        <div>
          <label for="title" class="block text-sm font-medium text-slate-700">Título</label>
          <input
            id="title" type="text" name="title" required maxlength="200"
            placeholder="Ej. No puedo acceder al panel de facturación"
            class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
          >
        </div>
        <div>
          <label for="description" class="block text-sm font-medium text-slate-700">Descripción</label>
          <textarea
            id="description" name="description" required maxlength="5000" rows="3"
            placeholder="Cuéntanos qué ha pasado, cuándo y a quién afecta."
            class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm placeholder:text-slate-400 focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
          ></textarea>
        </div>
        <button
          id="create-ticket-btn" type="submit"
          class="inline-flex items-center gap-2 rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-900/40 disabled:cursor-not-allowed disabled:opacity-60"
        >
          <svg class="htmx-indicator h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span>Crear ticket</span>
        </button>
      </form>
    </section>

    <section class="mt-6 rounded-lg bg-white p-5 shadow-sm ring-1 ring-slate-200 sm:p-6" aria-labelledby="filters-heading">
      <h2 id="filters-heading" class="text-base font-semibold">Filtrar tickets</h2>
      <form
        class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-3"
        hx-get="/ui/tickets" hx-target="#tickets-section" hx-swap="outerHTML" hx-trigger="change"
      >
        <div>
          <label for="filter-category" class="block text-sm font-medium text-slate-700">Categoría</label>
          <select
            id="filter-category" name="category"
            class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
          >
            <option value="">Todas</option>
            {% for c in ["bug", "feature_request", "question", "urgent"] %}
            <option value="{{ c }}">{{ {"bug": "Bug", "feature_request": "Mejora", "question": "Pregunta", "urgent": "Urgente"}[c] }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="filter-priority" class="block text-sm font-medium text-slate-700">Prioridad</label>
          <select
            id="filter-priority" name="priority"
            class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
          >
            <option value="">Todas</option>
            {% for p in ["P1", "P2", "P3"] %}
            <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="filter-status" class="block text-sm font-medium text-slate-700">Estado</label>
          <select
            id="filter-status" name="status"
            class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900/10"
          >
            <option value="">Todos</option>
            {% for s in ["open", "in_progress", "resolved", "closed"] %}
            <option value="{{ s }}">{{ {"open": "Abierto", "in_progress": "En progreso", "resolved": "Resuelto", "closed": "Cerrado"}[s] }}</option>
            {% endfor %}
          </select>
        </div>
      </form>
    </section>

    <div class="mt-6">
      {% include "_tickets_table.html" %}
    </div>
  </main>
</body>
</html>
